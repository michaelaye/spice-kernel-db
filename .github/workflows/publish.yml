name: Deploy docs to GitHub Pages

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # page timestamps from history

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install package and great-docs
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[docs]"

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Build docs (great-docs; converts the tutorial notebook first)
        run: make docs

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: great-docs/_site
          include-hidden-files: true  # .well-known/agent-skills/ (great-docs skill discovery)

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
