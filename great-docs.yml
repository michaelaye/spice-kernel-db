# great-docs configuration: https://posit-dev.github.io/great-docs/user-guide/configuration.html
parser: numpy
dynamic: false
display_name: spice-kernel-db
authors:
  - name: K.-Michael Aye
    role: Author
user_guide: docs

# API reference: exactly the public API (spice_kernel_db.__all__, checked by
# tests/test_api.py) plus the host contract, grouped as docs/index.qmd groups them.
reference:
  - title: "The database"
    desc: "One DuckDB file, content-addressed by SHA-256, with every kernel location and tracked metakernel."
    contents:
      - KernelDB
      - RegistryRow

  - title: "One call against the configured database"
    desc: "Each opens the database named in the config, does one thing and closes it."
    contents:
      - check
      - get
      - metakernels_covering
      - register_metakernel
      - resolve_metakernel
      - scan

  - title: "Configuration"
    desc: "The config file and the kernel roots. Nothing here prints or prompts."
    contents:
      - Config
      - ConfigError
      - ensure_config
      - kernel_roots
      - add_root
      - remove_root

  - title: "Metakernel files"
    desc: "Reading and writing .tm files."
    contents:
      - parse_metakernel
      - parse_metakernel_text

  - title: "Exceptions"
    contents:
      - AmbiguousKernelRoot
      - AmbiguousMetakernel
      - ConcurrentModificationError
      - LegacyDatabaseFound
      - MetakernelNotTracked
      - MetakernelUnreachableError

  - title: "Hosting the CLI"
    desc: "`spice_kernel_db.cli.app` is the Typer app a host mounts under its own command (planetarypy's `plp spice`); these two complete the host contract."
    contents:
      - cli.exit_code
      - cli.logging_to_stderr

# The agent skill (skill.md, .well-known/agent-skills/) is generated from the
# docstrings; these keys add the judgment a reader cannot get from signatures.
# Every `use` below names a public function, a KernelDB attribute, or a visible
# CLI command written as `skd <verb>` (tests/test_api.py).
skill:
  decision_table:
    - need: "From a shell: the metakernels a mission publishes"
      use: "skd browse MISSION; an unconfigured mission is looked up on NAIF and ESA and added"
    - need: "From a shell: one metakernel and its kernels, without prompts"
      use: "skd get URL -y"
    - need: "From a shell: what changed on the servers for everything skd tracks"
      use: "skd update to see the available updates, skd update --execute to perform them"
    - need: "From a shell: whether a tracked metakernel is complete"
      use: "skd check NAME, exit code as for check()"
    - need: "A metakernel from a NAIF or ESA server, with the kernels it lists"
      use: "get(url, yes=True)"
    - need: "The on-disk path of a metakernel skd tracks, from a filename, base name, path or URL"
      use: "resolve_metakernel(ref)"
    - need: "Whether a tracked metakernel is complete and every entry resolves"
      use: "check(ref) and the bits of its exit_code"
    - need: "A tracked metakernel whose SPK kernels cover a body at an ephemeris time"
      use: "metakernels_covering(body_id, et)"
    - need: "Kernels already on disk, indexed into the store"
      use: "scan(directory) for kernel files, register_metakernel(path) for a metakernel"
    - need: "The local path of one kernel file by name"
      use: "KernelDB.resolve_kernel(filename)"
    - need: "Several operations in a row"
      use: "KernelDB() as a context manager; read_only=True for queries"
  gotchas:
    - "skd manages kernel files and loads nothing. Hand the path from resolve_metakernel() to spiceypy.furnsh()."
    - "The library is quiet: without console= nothing is printed and every question is answered no, so pass yes=True to download."
    - "Where a download lands is derived (the root that holds the metakernel or its mission, else the only root); with several roots and no such fact AmbiguousKernelRoot is raised, and download_dir= is the explicit answer."
    - "check()'s exit_code is a sum of bits: 1 a kernel missing, 2 an entry does not resolve, 4 differs from the server (only with remote=True). 78 is a configuration error, never a verdict."
    - "The .tm skd writes carries absolute PATH_VALUES, so it works from any working directory."
    - "Warnings go through the spice_kernel_db logger; configure logging to see them."
    - "skd update without --execute changes nothing: it fetches every tracked .tm, reuses kernel sizes the server gave earlier today (--refresh asks again), and lists the available updates. --execute performs all of them: missing kernels, aliases moved to newer snapshots, and one question about moving archived snapshots to mk/former_versions/."
    - "Without a terminal skd never prompts: pass -y to get, and a name (plus --server-url when NAIF and ESA both list it) to mission add. browse NAME needs neither and picks ESA when both list the mission."
    - "Pin the release you tested with an upper bound below the next major (for example >=0.30,<1): spice_kernel_db.__all__ is the stability promise."
    - "Use the module-level functions for one call and a KernelDB for several; open it read_only=True for queries."
    - "A tracked name (juice_crema_5_2) is more stable than a URL: get() by URL once, then resolve_metakernel() and check() by name."
